<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="chipTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2b25"/>
      <stop offset="100%" stop-color="#101c17"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .label { font-family: 'Courier New', monospace; fill: #eafff5; font-weight: bold; }
      .sub { font-family: 'Courier New', monospace; fill: #7de3c8; }
      .tag { font-family: 'Courier New', monospace; fill: #3d5a52; font-size: 13px; }
      .rec { font-family: 'Courier New', monospace; fill: #ff4d5e; font-size: 14px; font-weight: bold; }
    </style>
  </defs>

  <rect width="1200" height="620" fill="url(#bg)"/>

  <!-- ===== ROTATING RADAR RING AROUND CHIP ===== -->
  <g transform="translate(600,260)">
    <!-- outer rotating ring with tick marks -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      <circle r="170" fill="none" stroke="#00ff9c" stroke-width="1.5" stroke-dasharray="4 10" opacity="0.6"/>
      <circle cx="170" cy="0" r="4" fill="#00ff9c"/>
    </g>
    <!-- inner rotating ring, opposite direction -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="4s" repeatCount="indefinite"/>
      <circle r="130" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="2 14" opacity="0.5"/>
      <circle cx="-130" cy="0" r="3.5" fill="#00d4ff"/>
    </g>
    <!-- sweeping radar wedge -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
      <path d="M0,0 L200,-40 A203,203 0 0,1 200,40 Z" fill="#00ff9c" opacity="0.06"/>
      <line x1="0" y1="0" x2="200" y2="0" stroke="#00ff9c" stroke-width="1" opacity="0.4"/>
    </g>

    <!-- ISOMETRIC CHIP (static center) -->
    <g filter="url(#glow)">
      <polygon points="0,-35 90,15 0,65 -90,15" fill="url(#chipTop)" stroke="#00ff9c" stroke-width="2.5"/>
      <polygon points="-90,15 0,65 0,105 -90,65" fill="#0a1712" stroke="#00ff9c" stroke-width="2"/>
      <polygon points="0,65 90,15 90,55 0,105" fill="#060f0b" stroke="#00ff9c" stroke-width="2"/>
      <circle cx="-70" cy="-5" r="4" fill="#00d4ff"/>
      <text x="0" y="10" text-anchor="middle" class="label" font-size="13">AYAN</text>
      <text x="0" y="24" text-anchor="middle" class="sub" font-size="10">ECE-v3</text>
    </g>

    <!-- pulsing status LEDs orbiting distance -->
    <circle cx="0" cy="-190" r="5" fill="#00ff9c"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="164" cy="95" r="5" fill="#00d4ff"><animate attributeName="opacity" values="1;0.2;1" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="-164" cy="95" r="5" fill="#ffd166"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="60" text-anchor="middle" class="sub" font-size="15">SYSTEM ACTIVE — SCANNING</text>

  <!-- ===== LIVE SIGNAL MONITOR STRIP ===== -->
  <rect x="70" y="470" width="1060" height="120" rx="8" fill="#0f1a14" stroke="#00ff9c" stroke-width="1.5"/>
  <circle cx="105" cy="495" r="5" fill="#ff4d5e">
    <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text x="120" y="500" class="rec">LIVE</text>
  <text x="1000" y="500" class="tag" text-anchor="end">SIGNAL MONITOR — CH.01</text>

  <!-- scrolling waveform (two copies offset for seamless loop) -->
  <clipPath id="scopeClip">
    <rect x="90" y="515" width="1020" height="60"/>
  </clipPath>
  <g clip-path="url(#scopeClip)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-360,0" dur="3s" repeatCount="indefinite"/>
      <path d="M90,545 L120,545 L135,515 L150,575 L165,525 L180,545 L210,545 L225,520 L240,570 L255,530 L270,545 L300,545 L315,515 L330,575 L345,525 L360,545 L390,545 L405,520 L420,570 L435,530 L450,545"
            fill="none" stroke="#00ff9c" stroke-width="2.5"/>
      <path d="M450,545 L480,545 L495,515 L510,575 L525,525 L540,545 L570,545 L585,520 L600,570 L615,530 L630,545 L660,545 L675,515 L690,575 L705,525 L720,545 L750,545 L765,520 L780,570 L795,530 L810,545"
            fill="none" stroke="#00ff9c" stroke-width="2.5"/>
      <path d="M810,545 L840,545 L855,515 L870,575 L885,525 L900,545 L930,545 L945,520 L960,570 L975,530 L990,545 L1020,545 L1035,515 L1050,575 L1065,525 L1080,545 L1110,545 L1125,520 L1140,570 L1155,530 L1170,545"
            fill="none" stroke="#00ff9c" stroke-width="2.5"/>
    </g>
  </g>

  <text x="70" y="605" class="tag">ISOMETRIC VIEW · LIVE TELEMETRY (SVG NATIVE ANIMATION — NO SCRIPTS)</text>
</svg>
