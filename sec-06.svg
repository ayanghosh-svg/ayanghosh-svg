<svg viewBox="0 0 1200 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .trace { stroke: #00ff9c; stroke-width: 2; fill: none; opacity: 0.55; }
      .trace-cyan { stroke: #00d4ff; stroke-width: 2; fill: none; opacity: 0.5; }
      .pad { fill: #00ff9c; }
      .pad-cyan { fill: #00d4ff; }
      .title { font-family: 'Courier New', monospace; font-weight: bold; fill: #eafff5; }
      .tag { font-family: 'Courier New', monospace; fill: #00ff9c; }
    </style>
  </defs>
  <rect width="1200" height="90" fill="url(#bg)"/>
  <path class="trace" d="M0,20 H60 V45 H140"/>
  <path class="trace-cyan" d="M0,70 H100 V45 H180"/>
  <path class="trace" d="M1200,20 H1140 V45 H1060"/>
  <path class="trace-cyan" d="M1200,70 H1100 V45 H1020"/>
  <circle class="pad" cx="140" cy="45" r="3.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite"/></circle>
  <circle class="pad-cyan" cx="180" cy="45" r="3.5"><animate attributeName="opacity" values="1;0.3;1" dur="1.7s" repeatCount="indefinite"/></circle>
  <circle class="pad" cx="1060" cy="45" r="3.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle class="pad-cyan" cx="1020" cy="45" r="3.5"><animate attributeName="opacity" values="1;0.3;1" dur="1.9s" repeatCount="indefinite"/></circle>
  <g filter="url(#glow)">
    <rect x="210" y="12" width="780" height="66" rx="8" fill="#0f1a14" stroke="#00ff9c" stroke-width="1.5"/>
    <text x="235" y="52" class="tag" font-size="20">§06</text>
    <text x="330" y="52" class="title" font-size="24">APPLICATIONS</text>
  </g>
</svg>